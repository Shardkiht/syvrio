# Local entry file. Set only values that should override the packaged defaults.
# Select this file via --config or SYVRIO_CONFIG. Place optional overrides in
# models.toml ([llm]), chat.toml ([chat]) and memory.toml ([retrieval],
# [retrieval.embedding], [recall], [distillation], [dream]) beside this file.
# See src/syvrio/defaults/ for the complete shipped settings.
#
# vault = "~/my-syvrio-vault"
# runtime = "~/my-syvrio-runtime"
# [git]
# auto_sync = false
#
# Optional GitHub-protected ngrok sharing (syvrio web share only):
# [web_share]
# domain = "demo.ngrok-free.dev"
# github_user_id = "12345"
#
# Example for a separate memory.toml:
# [retrieval]
# default_limit = 15
# [dream]
# context_window = 200000
