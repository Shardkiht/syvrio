# 这里只填写需要覆盖内置默认值的本地配置。
# 用 --config 或 SYVRIO_CONFIG 指定此文件。同目录还可按用途提供配置：
# models.toml 的 [llm]、chat.toml 的 [chat]，以及 memory.toml 的
# [retrieval]、[retrieval.embedding]、[recall]、[distillation] 和 [dream]。
# 完整的内置配置见 src/syvrio/infra/config/defaults/。
#
# vault = "~/my-syvrio-vault"
# runtime = "~/my-syvrio-runtime"
# [git]
# auto_sync = false
#
# 可选的 ngrok 分享配置，使用 GitHub 身份验证，仅用于 syvrio web share。
# [web_share]
# domain = "demo.ngrok-free.dev"
# github_user_id = "12345"
#
# 独立 memory.toml 配置示例：
# [retrieval]
# default_limit = 15
# [dream]
# context_window = 200000
