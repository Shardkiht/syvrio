[project]
name = "syvrio"
dynamic = ["version"]
description = "Local-first personal AI agent with persistent memory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shardkiht" }]
keywords = ["memory", "mcp", "markdown", "git", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.12",
    "httpx>=0.27",
    "jieba>=0.42",
    "keyring>=25.5",
    "litellm>=1.60",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "openai>=1.60",
    "packaging>=23",
    "pillow>=10",
    "platformdirs>=4",
    "prompt-toolkit>=3.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "tenacity>=8.2",
    "textual>=8.2.8",
    "tiktoken>=0.8",
    "typer>=0.15",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 本地向量检索：uv sync --extra local-embed
local-embed = ["fastembed>=0.3"]
documents = [
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.0",
]

[project.scripts]
syvrio = "syvrio.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.17.4",
]

[project.urls]
Homepage = "https://github.com/Shardkiht/syvrio"
Repository = "https://github.com/Shardkiht/syvrio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/syvrio/__init__.py"

[tool.uv]
cache-dir = ".cache/uv"
cache-keys = [{ file = "pyproject.toml" }, { file = "src/syvrio/__init__.py" }]

[tool.hatch.build.targets.wheel]
packages = ["src/syvrio"]
# 网页资源由 scripts/build_web.py 构建，Git 会忽略构建目录。
# artifacts 将资源打入 wheel，通过 PyPI 安装后即可使用，无需 Node.js。
artifacts = ["src/syvrio/app/web/static/**"]

[tool.hatch.build.targets.sdist]
# 仅打包可分发的项目内容，本机临时脚本不得随包发布。
include = [
    "/src", "/tests", "/evals", "/docs", "/web", "/README.md", "/README.en.md",
    "/LICENSE", "/AGENTS.md", "/config.example.toml", "/pyproject.toml", "/uv.lock",
    "/scripts/import_legacy_vault.py", "/scripts/vault_import/*.py",
]
exclude = ["/web/node_modules", "/web/dist"]

# Git 忽略暂存的 Vite 资源，hatchling 也会按版本控制规则过滤普通的源码包包含项。
# force-include 可显式纳入这些资源。
# uv build 从源码包构建 wheel，如果源码包缺少网页资源，
# 仅配置 wheel 的 artifacts 也无法补齐。
[tool.hatch.build.targets.sdist.force-include]
"src/syvrio/app/web/static" = "src/syvrio/app/web/static"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "ui: Textual 界面与交互测试",
    "agent: Agent 运行时、会话与上下文测试",
    "memory: 记忆存储、抽取、裁决与队列测试",
    "retrieval: 本地关键词与向量检索测试",
    "cli: 命令行入口测试",
    "config: 配置与供应商测试",
    "mcp: MCP 服务接口测试",
    "search: 联网搜索与抓取测试",
    "web: Web Adapter API 与 SSE 测试",
]


[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
