[project]
name = "syvrio"
version = "0.5.3rc1"
description = "Local-first personal AI agent with persistent memory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shardkiht" }]
keywords = ["memory", "mcp", "markdown", "git", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.12",
    "httpx>=0.27",
    "jieba>=0.42",
    "keyring>=25.5",
    "litellm>=1.60",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "openai>=1.60",
    "prompt-toolkit>=3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "tenacity>=8.2",
    "textual>=8.2.8",
    "tiktoken>=0.8",
    "typer>=0.15",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 本地向量检索：uv sync --extra local-embed
local-embed = ["fastembed>=0.3"]
documents = [
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.0",
]

[project.scripts]
syvrio = "syvrio.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.17.4",
]

[project.urls]
Homepage = "https://github.com/Shardkiht/syvrio"
Repository = "https://github.com/Shardkiht/syvrio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syvrio"]
# Vite output is generated by scripts/build_web.py and ignored by Git.
# artifacts forces it into the wheel, so PyPI installs need no Node.js.
artifacts = ["src/syvrio/app/web/static/**"]

[tool.hatch.build.targets.sdist]
# Only distributable project content; local one-off scripts must never ship.
include = [
    "/src", "/tests", "/evals", "/docs", "/web", "/README.md", "/README.en.md",
    "/LICENSE", "/AGENTS.md", "/config.example.toml", "/pyproject.toml", "/uv.lock",
]
exclude = ["/web/node_modules", "/web/dist"]

# The staged Vite bundle is git-ignored, so an explicit sdist include is
# filtered out by hatchling's VCS ignore rules. force-include bypasses them:
# `uv build` builds the wheel FROM the sdist, so the wheel would otherwise
# ship without Web assets even though `artifacts` looks correct.
[tool.hatch.build.targets.sdist.force-include]
"src/syvrio/app/web/static" = "src/syvrio/app/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "ui: Textual 界面与交互测试",
    "agent: Agent 运行时、会话与上下文测试",
    "memory: 记忆存储、抽取、裁决与队列测试",
    "retrieval: 本地关键词与向量检索测试",
    "cli: 命令行入口测试",
    "config: 配置与供应商测试",
    "mcp: MCP 服务接口测试",
    "search: 联网搜索与抓取测试",
    "web: Web Adapter API 与 SSE 测试",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
