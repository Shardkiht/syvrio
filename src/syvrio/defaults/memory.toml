[retrieval]
method = "hybrid"
default_limit = 10

[retrieval.embedding]
backend = "local"
model = "BAAI/bge-small-zh-v1.5"
provider = "siliconflow"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"

[recall]
auto_recall = 3
recall_rewrite = true
recall_context_turns = 2
cue_limit = 7
rewrite_timeout = 4.0

[distillation]
extract_on_exit = true
recall_limit = 7

[dream]
auto_reflect = true
dream_auto_interval_hours = 24.0
default_budget = 20
