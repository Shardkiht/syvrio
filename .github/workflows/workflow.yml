name: publish-syvrio-manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/feature-memory-evolution'
    # PyPI trusted publisher for syvrio must be configured before manual dispatch.
    runs-on: ubuntu-latest
    container: debian:13-slim
    environment:
      name: pypi
      url: https://pypi.org/p/syvrio
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Debian prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libstdc++6
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Require an Evo prerelease version
        run: |
          uv run --frozen python - <<'PYTHON'
          import re
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as file:
              version = Version(tomllib.load(file)["project"]["version"])
          if not re.fullmatch(r"\d+\.\d+\.\d+rc\d+", str(version)):
              raise SystemExit(f"Evo must use a PyPI prerelease version, such as 0.5.2rc1; got {version}")
          PYTHON

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: uv sync --frozen

      - name: Build and stage Web assets
        run: uv run python scripts/build_web.py

      - name: Verify staged Web assets
        run: uv run python scripts/build_web.py --check

      - name: Frontend tests
        working-directory: web
        run: corepack pnpm test

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build --clear

      # Fail the release before publishing if the wheel would ship without the UI.
      - name: Verify wheel contains Web assets
        run: uv run python scripts/build_web.py --wheel dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
