name: publish-syvrio-manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install Debian prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libstdc++6
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Build and stage Web assets
        run: uv run python scripts/build_web.py
      - name: Frontend tests
        working-directory: web
        run: corepack pnpm test
      - name: Build
        run: uv build
      - name: Verify wheel contains Web assets
        run: uv run python scripts/build_web.py --wheel dist/*.whl

      - name: Verify distribution contents
        run: |
          uv run --frozen python - <<'PY'
          import configparser
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          artifacts = [
              item for item in Path("dist").iterdir()
              if item.is_file() and item.name.endswith((".whl", ".tar.gz"))
          ]
          wheels = [item for item in artifacts if item.name == f"syvrio-{version}-py3-none-any.whl"]
          sdists = [item for item in artifacts if item.name == f"syvrio-{version}.tar.gz"]
          assert len(artifacts) == 2 and len(wheels) == 1 and len(sdists) == 1, artifacts
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "syvrio/__init__.py" in names
              assert not any(name.startswith(("quiet_memo/", "quietmemo/")) for name in names)
              entrypoints = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert len(entrypoints) == 1
              parser = configparser.ConfigParser()
              parser.read_string(archive.read(entrypoints[0]).decode("utf-8"))
              assert dict(parser.items("console_scripts")) == {"syvrio": "syvrio.app.cli:main"}
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              assert f"syvrio-{version}/src/syvrio/__init__.py" in names
              assert not any("/src/quiet_memo/" in name or "/src/quietmemo/" in name for name in names)
          print(f"Validated syvrio {version} distributions: no legacy Python package or CLI entry points.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/syvrio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
